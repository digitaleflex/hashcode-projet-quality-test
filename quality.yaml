version: 1
name: hashcode-universal-quality

# Risk-based defaults. A project may override these in its own repository.
profiles:
  minimal:
    - lint
    - typecheck
    - unit
    - dependency_hygiene
  standard:
    - lint
    - typecheck
    - unit
    - integration
    - dependency_hygiene
    - architecture
    - secrets
    - sast
  production:
    - lint
    - typecheck
    - unit
    - integration
    - e2e
    - dependency_hygiene
    - architecture
    - duplication
    - secrets
    - sast
    - vulnerability_scan
    - sbom
    - performance
    - accessibility
    - dast
  ai:
    extends: production
    adds:
      - llm_evaluation
      - prompt_injection_tests
      - tool_authorization_tests
      - data_leakage_tests
      - model_regression_tests
      - cost_latency_tracking

policies:
  fail_on:
    - exposed_secret
    - critical_vulnerability
    - failing_required_test
    - typecheck_failure
  advisory:
    - unused_file
    - unused_export
    - unused_dependency
    - duplication
    - dead_css
    - performance_regression
  never_auto_delete:
    - source_file
    - dependency
    - export
    - css_selector

report:
  required_sections:
    - executive_summary
    - findings
    - evidence
    - false_positive_risk
    - remediation
    - regression_tests
    - residual_risk
